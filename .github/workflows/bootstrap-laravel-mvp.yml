name: bootstrap-laravel-mvp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (mvp)
        uses: actions/checkout@v4
        with:
          ref: mvp
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean branch (keep .github and README.md)
        shell: bash
        run: |
          shopt -s dotglob extglob
          mkdir -p .github/workflows
          for f in *; do
            if [[ "$f" == ".git" || "$f" == ".github" || "$f" == "README.md" ]]; then
              continue
            fi
            rm -rf "$f"
          done

      - name: Create Laravel project in temp dir
        run: |
          composer create-project laravel/laravel laravel_tmp "^11.0"

      - name: Move Laravel files to repo root
        run: |
          rsync -a --delete --exclude ".git" --exclude ".github" laravel_tmp/ ./
          rm -rf laravel_tmp

      - name: Install Laravel Breeze (Blade)
        run: |
          composer require laravel/breeze --dev
          php artisan breeze:install blade
          npm ci
          npm run build

      - name: Install Socialite (Google)
        run: |
          composer require laravel/socialite

      - name: Add roles + events/submissions migrations
        shell: bash
        run: |
          php -r '
          $path="database/migrations";
          $files=glob($path."/*_create_users_table.php");
          if(!$files){fwrite(STDERR,"users migration not found\n"); exit(1);}
          $file=$files[0];
          $c=file_get_contents($file);
          $c=preg_replace(
            "/\\$table->string\\(\\x27email\\x27\\)->unique\\(\\);/",
            "\$table->string(\x27email\x27)->unique()->nullable();\n            \$table->string(\x27phone\x27)->unique()->nullable();\n            \$table->string(\x27google_id\x27)->nullable()->index();\n            \$table->enum(\x27role\x27,[\x27organizer\x27,\x27researcher\x27])->default(\x27researcher\x27);",
            $c,
            1
          );
          file_put_contents($file,$c);
          '

          cat > database/migrations/2026_03_25_000001_create_events_table.php <<'PHP'
          <?php
          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration {
              public function up(): void {
                  Schema::create('events', function (Blueprint $table) {
                      $table->id();
                      $table->foreignId('organizer_id')->constrained('users')->cascadeOnDelete();
                      $table->string('title');
                      $table->string('slug')->unique();
                      $table->longText('description')->nullable();
                      $table->text('topics')->nullable();
                      $table->string('location')->nullable();
                      $table->date('start_date')->nullable();
                      $table->date('end_date')->nullable();
                      $table->json('deadlines')->nullable();
                      $table->boolean('is_published')->default(false);
                      $table->timestamps();
                  });
              }
              public function down(): void { Schema::dropIfExists('events'); }
          };
          PHP

          cat > database/migrations/2026_03_25_000002_create_submissions_table.php <<'PHP'
          <?php
          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration {
              public function up(): void {
                  Schema::create('submissions', function (Blueprint $table) {
                      $table->id();
                      $table->foreignId('event_id')->constrained('events')->cascadeOnDelete();
                      $table->foreignId('researcher_id')->constrained('users')->cascadeOnDelete();
                      $table->string('paper_title');
                      $table->longText('abstract')->nullable();
                      $table->string('keywords')->nullable();
                      $table->string('file_path')->nullable();
                      $table->unsignedBigInteger('file_size')->nullable();
                      $table->enum('status', ['received','in_review','accepted','rejected','needs_changes'])->default('received');
                      $table->text('notes_to_author')->nullable();
                      $table->timestamps();
                      $table->unique(['event_id','researcher_id']);
                  });
              }
              public function down(): void { Schema::dropIfExists('submissions'); }
          };
          PHP

      - name: Commit & push to mvp
        run: |
          git add -A
          git commit -m "Bootstrap Laravel MVP (conferences platform)" || echo "No changes to commit"
          git push origin mvp
